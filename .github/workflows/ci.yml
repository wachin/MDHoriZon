name: CI

# Verification for every change. It also runs on `main` so the branch keeps a status, and
# on demand. The Pages deploy is a separate workflow and is deliberately not chained to this
# one: `main` only receives commits from pull requests that already passed this job.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: this job only checks out and verifies. No secrets are needed, so it is safe for
# pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format, lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Single source of truth: the version contributors get from `nvm use`.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
