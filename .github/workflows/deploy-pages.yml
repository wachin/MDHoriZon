name: Deploy to GitHub Pages

# Phase 13 target, wired up early so the repository's Pages setting is not left
# half-configured (Pages with "GitHub Actions" as the source publishes nothing until a
# workflow uploads an artifact). This workflow is intentionally minimal: it publishes
# whatever `npm run build` produces, which is currently the Vite starter screen.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required to publish to Pages and to mint the OIDC token the deploy step needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, but never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        # The base path comes from Pages itself, so a fork (or a renamed repository)
        # deploys correctly without editing vite.config.ts. VITE_BASE overrides the
        # default base that the config uses for this repository.
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Keep dist/.nojekyll in the artifact. Artifact-based deployments never run
          # Jekyll, so this is only insurance if the deployment mode ever changes.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
